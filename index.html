<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pakistan dairy farm management: herd, milk production, AI & breeding, milk sales to companies and local buyers — offline-first PWA.">
  <meta name="theme-color" content="#2e7d32">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' https://eposwala.com https://cdn.jsdelivr.net; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dairy Farm">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
  <title>Dairy Farm Manager</title>
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <img src="icons/logo.svg" alt="" width="88" height="88">
    <div class="fw-semibold mt-3">Dairy Farm Manager</div>
    <div class="spinner-border spinner-border-sm text-success mt-3" role="status"><span class="visually-hidden">Loading</span></div>
    <div id="splash-error" class="text-danger small mt-3 px-4 text-center"></div>
  </div>

  <!-- Login -->
  <div id="view-login" class="d-none">
    <div class="login-bg">
      <div class="login-wrap">
        <div class="login-card card shadow-lg overflow-hidden border-0">

          <!-- Farm scene header -->
          <div class="login-scene-wrap">
            <svg class="login-scene" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="lsk" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ffe0b2"/><stop offset="45%" stop-color="#fff9c4"/><stop offset="100%" stop-color="#c8e6c9"/>
                </linearGradient>
                <linearGradient id="lh1" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#66bb6a"/><stop offset="100%" stop-color="#388e3c"/>
                </linearGradient>
                <linearGradient id="lgnd" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#4caf50"/><stop offset="100%" stop-color="#1b5e20"/>
                </linearGradient>
                <filter id="sglow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              </defs>
              <!-- Morning sky -->
              <rect width="400" height="200" fill="url(#lsk)"/>
              <!-- Rising sun (left) -->
              <circle cx="52" cy="58" r="32" fill="#ffecb3" opacity="0.65" filter="url(#sglow)"/>
              <circle cx="52" cy="58" r="20" fill="#ffca28"/>
              <g stroke="#ffca28" stroke-width="2" opacity=".65" stroke-linecap="round">
                <line x1="52" y1="32" x2="52" y2="24"/><line x1="52" y1="84" x2="52" y2="92"/>
                <line x1="26" y1="58" x2="18" y2="58"/><line x1="78" y1="58" x2="86" y2="58"/>
                <line x1="33" y1="39" x2="27" y2="33"/><line x1="71" y1="77" x2="77" y2="83"/>
                <line x1="71" y1="39" x2="77" y2="33"/><line x1="33" y1="77" x2="27" y2="83"/>
              </g>
              <!-- Clouds -->
              <g opacity=".9">
                <ellipse cx="210" cy="34" rx="48" ry="19" fill="white"/>
                <ellipse cx="240" cy="27" rx="36" ry="16" fill="white"/>
                <ellipse cx="182" cy="32" rx="28" ry="13" fill="white"/>
              </g>
              <g opacity=".7">
                <ellipse cx="345" cy="50" rx="34" ry="14" fill="white"/>
                <ellipse cx="368" cy="44" rx="24" ry="11" fill="white"/>
              </g>
              <!-- Hills -->
              <ellipse cx="200" cy="240" rx="310" ry="130" fill="#a5d6a7"/>
              <ellipse cx="70" cy="220" rx="210" ry="100" fill="url(#lh1)"/>
              <ellipse cx="350" cy="210" rx="215" ry="95" fill="#66bb6a"/>
              <!-- Ground -->
              <rect x="0" y="155" width="400" height="45" fill="url(#lgnd)"/>
              <!-- White dairy barn -->
              <rect x="295" y="103" width="84" height="56" fill="#f5f5f5" rx="2"/>
              <rect x="295" y="103" width="84" height="7" fill="#e0e0e0"/>
              <polygon points="288,103 386,103 337,72" fill="#eeeeee"/>
              <polygon points="288,103 386,103 337,72" fill="none" stroke="#bdbdbd" stroke-width="1.5"/>
              <!-- Barn door -->
              <rect x="319" y="126" width="30" height="33" fill="#e0e0e0" rx="1"/>
              <line x1="334" y1="126" x2="334" y2="159" stroke="#bdbdbd" stroke-width="1"/>
              <!-- Barn windows -->
              <rect x="299" y="111" width="16" height="11" fill="#b3e5fc" rx="2" opacity=".9"/>
              <rect x="350" y="111" width="16" height="11" fill="#b3e5fc" rx="2" opacity=".9"/>
              <!-- Roof vent -->
              <circle cx="337" cy="87" r="6" fill="#b0bec5"/><circle cx="337" cy="87" r="3" fill="#78909c"/>
              <!-- Fence -->
              <g stroke="#795548" stroke-width="2.1" stroke-linecap="round">
                <line x1="95" y1="157" x2="283" y2="157"/>
                <line x1="95" y1="147" x2="283" y2="147"/>
                <line x1="105" y1="143" x2="105" y2="162"/>
                <line x1="135" y1="143" x2="135" y2="162"/>
                <line x1="165" y1="143" x2="165" y2="162"/>
                <line x1="195" y1="143" x2="195" y2="162"/>
                <line x1="225" y1="143" x2="225" y2="162"/>
                <line x1="255" y1="143" x2="255" y2="162"/>
                <line x1="278" y1="143" x2="278" y2="162"/>
              </g>
              <!-- Holstein dairy cow (black &amp; white patches) -->
              <!-- Body -->
              <ellipse cx="192" cy="131" rx="45" ry="23" fill="white" stroke="#e0e0e0" stroke-width=".5"/>
              <!-- Black body patches -->
              <ellipse cx="180" cy="122" rx="17" ry="11" fill="#212121" opacity=".85"/>
              <ellipse cx="208" cy="134" rx="14" ry="9" fill="#212121" opacity=".85"/>
              <ellipse cx="171" cy="137" rx="9" ry="7" fill="#212121" opacity=".8"/>
              <!-- Neck -->
              <rect x="227" y="116" width="13" height="19" fill="white" rx="5" stroke="#e0e0e0" stroke-width=".5"/>
              <!-- Head -->
              <ellipse cx="241" cy="113" rx="20" ry="15" fill="white" stroke="#e0e0e0" stroke-width=".5"/>
              <ellipse cx="234" cy="106" rx="11" ry="8" fill="#212121" opacity=".8"/>
              <!-- Snout -->
              <ellipse cx="254" cy="120" rx="10" ry="8" fill="#f8bbd0"/>
              <ellipse cx="251" cy="118" rx="2.5" ry="2" fill="#ce93d8" opacity=".7"/>
              <ellipse cx="257" cy="118" rx="2.5" ry="2" fill="#ce93d8" opacity=".7"/>
              <!-- Eye -->
              <circle cx="244" cy="111" r="3.5" fill="#2e7d32"/><circle cx="244" cy="111" r="2" fill="#1a237e"/><circle cx="245" cy="110" r="1" fill="white"/>
              <!-- Ear -->
              <ellipse cx="222" cy="103" rx="8" ry="11" fill="white" stroke="#e0e0e0" stroke-width=".5" transform="rotate(-20 222 103)"/>
              <ellipse cx="222" cy="103" rx="4" ry="6.5" fill="#f8bbd0" transform="rotate(-20 222 103)"/>
              <!-- Horn -->
              <path d="M224 102 Q217 87 226 83" fill="none" stroke="#d7ccc8" stroke-width="3" stroke-linecap="round"/>
              <!-- Legs -->
              <rect x="158" y="150" width="8" height="18" fill="white" rx="3" stroke="#e0e0e0" stroke-width=".5"/>
              <rect x="171" y="150" width="8" height="18" fill="white" rx="3" stroke="#e0e0e0" stroke-width=".5"/>
              <rect x="202" y="150" width="8" height="18" fill="white" rx="3" stroke="#e0e0e0" stroke-width=".5"/>
              <rect x="215" y="150" width="8" height="18" fill="white" rx="3" stroke="#e0e0e0" stroke-width=".5"/>
              <rect x="202" y="153" width="8" height="7" fill="#212121" opacity=".7" rx="2"/>
              <!-- Hooves -->
              <rect x="158" y="165" width="8" height="5" fill="#4e342e" rx="2"/><rect x="171" y="165" width="8" height="5" fill="#4e342e" rx="2"/>
              <rect x="202" y="165" width="8" height="5" fill="#4e342e" rx="2"/><rect x="215" y="165" width="8" height="5" fill="#4e342e" rx="2"/>
              <!-- Udder -->
              <ellipse cx="182" cy="151" rx="14" ry="8" fill="#f48fb1"/>
              <rect x="174" y="156" width="4" height="6" fill="#f48fb1" rx="2"/><rect x="182" y="156" width="4" height="6" fill="#f48fb1" rx="2"/>
              <!-- Tail -->
              <path d="M147 129 Q131 114 135 102" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
              <ellipse cx="135" cy="100" rx="5" ry="7" fill="#212121" opacity=".75"/>
              <!-- Milk churns (foreground) -->
              <g transform="translate(60,140)">
                <ellipse cx="14" cy="2" rx="14" ry="4" fill="#b0bec5"/>
                <rect x="1" y="0" width="26" height="24" fill="#cfd8dc" rx="2"/>
                <ellipse cx="14" cy="24" rx="13" ry="3" fill="#b0bec5"/>
                <rect x="6" y="-5" width="16" height="7" fill="#90a4ae" rx="3"/>
                <ellipse cx="14" cy="-2" rx="8" ry="2" fill="#78909c"/>
                <path d="M5 8 Q0 14 5 20" fill="none" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/>
                <ellipse cx="8" cy="10" rx="4" ry="7" fill="white" opacity=".2" transform="rotate(-10 8 10)"/>
                <ellipse cx="40" cy="8" rx="10" ry="3" fill="#b0bec5"/>
                <rect x="31" y="6" width="18" height="18" fill="#eceff1" rx="2"/>
                <ellipse cx="40" cy="24" rx="9" ry="2.5" fill="#b0bec5"/>
                <rect x="34" y="1" width="12" height="7" fill="#90a4ae" rx="3"/>
                <ellipse cx="40" cy="4" rx="6" ry="1.5" fill="#78909c"/>
                <ellipse cx="36" cy="14" rx="3" ry="5" fill="white" opacity=".2" transform="rotate(-10 36 14)"/>
              </g>
              <!-- Tree -->
              <rect x="22" y="116" width="8" height="44" fill="#5d4037" rx="4"/>
              <ellipse cx="26" cy="106" rx="24" ry="25" fill="#388e3c"/>
              <ellipse cx="26" cy="97" rx="17" ry="18" fill="#43a047"/>
              <!-- Grass tufts -->
              <g fill="#1b5e20">
                <path d="M0 200 Q5 190 10 200 Q15 191 20 200Z"/>
                <path d="M45 200 Q50 192 55 200 Q60 192 65 200Z"/>
                <path d="M370 200 Q375 192 380 200 Q385 192 390 200Z"/>
              </g>
            </svg>
            <!-- Brand overlay at bottom of scene -->
            <div class="login-brand-bar">
              <img src="icons/logo.svg" alt="Dairy Farm Logo" width="46" height="46" class="login-logo-img">
              <div>
                <div class="login-brand-name" id="login-title">Dairy Farm Manager</div>
                <div class="login-brand-sub">Pakistan's Complete Dairy System</div>
              </div>
            </div>
          </div>

          <!-- Form area -->
          <div class="login-form-area">
            <div id="login-notice" class="alert alert-warning small d-none"></div>
            <form id="login-form" novalidate>
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="login-username" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                <label for="login-username" id="login-username-label">Username</label>
              </div>
              <div class="form-floating mb-3 position-relative">
                <input type="password" class="form-control" id="login-password" name="password" placeholder="Password" autocomplete="current-password" required>
                <label for="login-password" id="login-password-label">Password</label>
                <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-body-secondary" id="toggle-pw" aria-label="Show password"><i class="bi bi-eye"></i></button>
              </div>
              <div id="login-error" class="alert alert-danger py-2 small d-none"></div>
              <button type="submit" class="btn btn-success btn-lg w-100 fw-semibold" id="login-btn">Sign in</button>
            </form>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <button class="btn btn-outline-secondary btn-sm" id="lang-toggle">اردو</button>
              <div class="small text-body-secondary" id="login-conn"></div>
            </div>
          </div>

        </div>
        <div class="text-center small login-footer-note mt-3" id="login-internet-note">Internet is required to sign in. After sign-in the app works offline.</div>
      </div>
    </div>
  </div>

  <!-- Application -->
  <div id="view-app" class="d-none">
    <aside id="sidebar" class="d-none d-lg-flex flex-column">
      <div class="sidebar-brand">
        <img src="icons/logo.svg" alt="" width="30" height="30" class="brand-logo">
        <span id="brand-name">Dairy Farm</span>
      </div>
      <nav class="nav flex-column flex-grow-1 overflow-auto nav-menu" aria-label="Main"></nav>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <button class="btn btn-link text-body d-lg-none px-1" data-bs-toggle="offcanvas" data-bs-target="#menu-offcanvas" aria-label="Menu"><i class="bi bi-list fs-4"></i></button>
        <div class="fw-semibold text-truncate flex-grow-1" id="topbar-title">Dashboard</div>
        <span id="conn-badge" class="badge rounded-pill conn-online" title="Connection status"><i class="bi bi-wifi"></i> <span>Online</span></span>
        <button class="btn btn-link text-body px-1 btn-sm" id="lang-toggle" title="Toggle language"><i class="bi bi-translate"></i></button>
        <div class="dropdown">
          <button class="btn btn-link text-body px-1" data-bs-toggle="dropdown" aria-label="Account"><i class="bi bi-person-circle fs-5"></i></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><div class="dropdown-item-text small"><div class="fw-semibold" id="user-name"></div><div class="text-body-secondary" id="user-role"></div></div></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#/settings"><i class="bi bi-gear me-2"></i>Settings</a></li>
            <li><button class="dropdown-item d-none" id="install-btn"><i class="bi bi-download me-2"></i>Install app</button></li>
            <li><button class="dropdown-item text-danger" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i>Log out</button></li>
          </ul>
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
    </div>
    <nav id="bottom-nav" class="d-lg-none" aria-label="Quick navigation">
      <a href="#/dashboard" data-route="dashboard"><i class="bi bi-house"></i><span>Home</span></a>
      <a href="#/animals" data-route="animals"><i class="bi bi-collection"></i><span>Animals</span></a>
      <a href="#/milk" data-route="milk" class="nav-milk"><i class="bi bi-droplet-half-fill"></i><span>Milk</span></a>
      <a href="#/milkSales" data-route="milkSales"><i class="bi bi-bag-check"></i><span>Sales</span></a>
      <a href="#" data-bs-toggle="offcanvas" data-bs-target="#menu-offcanvas"><i class="bi bi-grid"></i><span>More</span></a>
    </nav>
  </div>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="menu-offcanvas" aria-labelledby="menu-title">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="menu-title">Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0"><nav class="nav flex-column nav-menu" aria-label="Main"></nav></div>
  </div>

  <div id="toast-container" class="toast-container position-fixed top-0 start-50 translate-middle-x p-3"></div>
  <div id="loading-overlay" class="d-none"><div class="bg-body rounded-3 shadow p-3 d-flex align-items-center gap-2"><div class="spinner-border spinner-border-sm text-success"></div><span class="loading-text">Please wait…</span></div></div>
  <div id="print-area" aria-hidden="true"></div>

  <noscript><div class="alert alert-danger m-3">JavaScript is required to run this application.</div></noscript>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
